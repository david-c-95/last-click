<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Click</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- MAIN MENU -->

        <section id="mainMenu">

            <header>
                <h1>LAST <span>CLICK</span></h1>
                <p class="subtitle">How lucky are you?</p>
            </header>

            <button class="mode-button" id="soloButton">
                <span class="mode-title">SOLO</span>
                <span class="mode-description">
                    Test your luck.
                </span>
            </button>

            <button class="mode-button" id="onlineButton">
                <span class="mode-title">ONLINE</span>
                <span class="mode-description">
                    Be the last one standing.
                </span>
            </button>

        </section>


        <!-- SOLO MODE -->

        <section id="soloGame" hidden>

            <button class="back-button" id="backButton">
                ← BACK TO MENU
            </button>

            <h2>SOLO <span>MODE</span></h2>

            <p id="gameStatus" aria-live="polite">
                Choose a popcorn
            </p>

            <div id="gameGrid"></div>

            <p id="gameScore">Safe clicks: 0/5</p>

            <button class="action-button"
                    id="restartButton"
                    hidden>
                PLAY AGAIN
            </button>

        </section>


        <!-- ONLINE MENU -->

        <section id="onlineMenu" hidden>

            <button class="back-button" id="onlineBackButton">
                ← BACK TO MENU
            </button>

            <h2>ONLINE <span>MODE</span></h2>

            <p class="subtitle">
                Play with your friends.
            </p>

            <div class="online-form">

                <label for="nicknameInput">Nickname</label>

                <input type="text"
                       id="nicknameInput"
                       placeholder="Your nickname"
                       maxlength="20"
                       autocomplete="off">

                <label for="roomInput">Room name</label>

                <input type="text"
                       id="roomInput"
                       placeholder="Room name"
                       maxlength="30"
                       autocomplete="off">

                <button class="action-button"
                        id="joinRoomButton">
                    JOIN ROOM
                </button>

                <div class="form-separator">
                    OR
                </div>

                <label for="passwordInput">
                    Creation password
                </label>

                <input type="password"
                       id="passwordInput"
                       placeholder="Password">

                <button class="action-button"
                        id="createRoomButton">
                    CREATE ROOM
                </button>

                <p id="onlineStatus" aria-live="polite"></p>

            </div>

        </section>


        <!-- ONLINE LOBBY -->

        <section id="onlineLobby" hidden>

            <button class="back-button" id="leaveRoomButton">
                ← LEAVE ROOM
            </button>

            <h2>WAITING <span>ROOM</span></h2>

            <p class="subtitle">
                Room: <strong id="lobbyRoomName"></strong>
            </p>

            <p id="playerCount">Players: 0/10</p>

            <div id="playerList"></div>

            <p id="lobbyStatus" aria-live="polite">
                Waiting for players...
            </p>

            <button class="action-button"
                    id="startGameButton"
                    hidden>
                START GAME
            </button>

        </section>


        <footer>LAST CLICK — v0.3</footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
