
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Click</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>LAST <span>CLICK</span></h1>
            <p class="subtitle">How lucky are you?</p>
        </header>

        <section id="mainMenu">

            <button class="mode-button" id="soloButton">
                <span class="mode-title">SOLO</span>
                <span class="mode-description">Test your luck.</span>
            </button>

            <button class="mode-button" id="onlineButton">
                <span class="mode-title">ONLINE</span>
                <span class="mode-description">Be the last one standing.</span>
            </button>

        </section>

        <footer>LAST CLICK — v0.1</footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
